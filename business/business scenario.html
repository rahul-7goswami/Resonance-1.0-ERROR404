<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance — Resonance</title>
<style>
/* =========================================================
   Shared tokens — copied from the Resonance homepage stylesheet
   so this page renders as the same design system.
   ========================================================= */
:root {
  --bg-primary: #FBFBFD;
  --bg-secondary: #F5F5F7;
  --card-bg: rgba(255, 255, 255, 0.60);
  --card-border: rgba(0, 0, 0, 0.06);
  --card-border-hover: rgba(255, 45, 85, 0.28);

  --pink-primary: #FF2D55;
  --pink-hover: #E0264A;
  --pink-soft: #FFF0F3;
  --pink-tint: rgba(255, 45, 85, 0.08);
  --pink-gradient: linear-gradient(135deg, #FF375F 0%, #FF6482 100%);
  --pink-glow: rgba(255, 45, 85, 0.16);

  --text-primary: #1D1D1F;
  --text-secondary: #6E6E73;
  --text-tertiary: #86868B;
  --text-light: #FFFFFF;

  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", "Helvetica Neue", sans-serif;

  --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.04);
  --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.02);
  --shadow-card-hover: 0 24px 50px rgba(255, 45, 85, 0.14), 0 4px 12px rgba(0, 0, 0, 0.03);

  --radius-big-squarcle: 34px;
  --radius-rect-squarcle: 22px;
  --radius-pill: 9999px;

  --transition-apple: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-fast: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

body{
  font-family:var(--font-family);
  background-color:var(--bg-primary);
  color:var(--text-primary);
  overflow-x:hidden;
  min-height:100vh;
  line-height:1.5;
}

.grain-overlay{
  position:fixed; inset:0; width:100%; height:100%;
  z-index:1; pointer-events:none; opacity:0.05;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

.app-viewport{
  position:relative;
  width:100vw;
  min-height:100vh;
  overflow:hidden;
  z-index:2;
}

/* Screen transitions — same choreography as the homepage's screen-section */
.screen-section{
  position:absolute;
  top:0; left:0;
  width:100%; min-height:100vh;
  display:flex;
  justify-content:center;
  padding:5rem 2rem 4rem;
  opacity:0;
  pointer-events:none;
  transform:translateY(100vh);
  transition:var(--transition-apple);
  overflow-y:auto;
}
.screen-section.active{ opacity:1; pointer-events:auto; transform:translateY(0); position:relative; }
.screen-section.exit-up{ opacity:0; pointer-events:none; transform:translateY(-100vh); }
.screen-section.pre-enter{ opacity:0; pointer-events:none; transform:translateY(100vh); }

.page-container{
  width:100%;
  max-width:720px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.6rem;
}

/* Header */
.finance-header{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:0.4rem;
}
.subheading-tag{
  color:var(--pink-primary);
  font-size:0.85rem;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-bottom:0.3rem;
  display:block;
}
.section-title{
  font-size:clamp(1.7rem, 3.2vw, 2.3rem);
  font-weight:700;
  letter-spacing:-0.025em;
  color:var(--text-primary);
}
.section-desc{
  font-size:0.98rem;
  color:var(--text-secondary);
  max-width:52ch;
  margin-top:0.5rem;
  line-height:1.5;
}

/* Pill tab steps */
.step-tabs{
  display:flex;
  gap:0.4rem;
  background:var(--bg-secondary);
  padding:0.35rem;
  border-radius:var(--radius-pill);
  border:1px solid var(--card-border);
}
.step-tab{
  border:none;
  background:none;
  font-family:inherit;
  font-size:0.85rem;
  font-weight:600;
  color:var(--text-tertiary);
  padding:0.5rem 1rem;
  border-radius:var(--radius-pill);
  cursor:pointer;
  transition:var(--transition-fast);
}
.step-tab.active{
  background:var(--text-light);
  color:var(--pink-primary);
  box-shadow:var(--shadow-subtle);
}
.step-tab:disabled{ cursor:not-allowed; opacity:0.4; }
.step-tab:not(:disabled):not(.active):hover{ color:var(--text-primary); }

/* Squarcle-style list rows (resources, stop-loss, scenarios, comparison) */
.list-stack{ width:100%; display:flex; flex-direction:column; gap:0.9rem; }

.rect-squarcle{
  background:var(--card-bg);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow-card);
  border-radius:var(--radius-rect-squarcle);
  padding:1.2rem 1.5rem;
  display:flex;
  align-items:center;
  gap:1.1rem;
  transition:var(--transition-apple);
}
.rect-squarcle:hover{
  border-color:var(--card-border-hover);
  box-shadow:var(--shadow-card-hover);
  transform:translateY(-3px);
}

.rect-badge{
  width:44px; height:44px;
  border-radius:14px;
  background-color:var(--pink-soft);
  color:var(--pink-primary);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  font-weight:700;
  font-size:1.05rem;
  transition:var(--transition-fast);
}
.rect-squarcle:hover .rect-badge{ background:var(--pink-gradient); color:var(--text-light); }

.rect-text{ flex-grow:1; min-width:0; }
.rect-title{ font-size:1.02rem; font-weight:600; color:var(--text-primary); letter-spacing:-0.01em; }
.rect-desc{ font-size:0.85rem; color:var(--text-secondary); margin-top:0.15rem; }

.rect-value{
  font-variant-numeric:tabular-nums;
  font-weight:700;
  color:var(--pink-primary);
  white-space:nowrap;
  font-size:1rem;
}

.icon-remove{
  background:none; border:none; cursor:pointer;
  color:var(--text-tertiary);
  width:28px; height:28px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1.1rem;
  transition:var(--transition-fast);
  flex-shrink:0;
}
.icon-remove:hover{ background:var(--pink-soft); color:var(--pink-primary); }

.empty-state{
  width:100%;
  text-align:center;
  padding:2.4rem 1rem;
  color:var(--text-tertiary);
  font-size:0.92rem;
  background:var(--bg-secondary);
  border-radius:var(--radius-rect-squarcle);
  border:1px dashed var(--card-border);
}

/* Inputs */
.field-group{
  width:100%;
  display:flex;
  gap:0.8rem;
  flex-wrap:wrap;
  align-items:flex-end;
}
.field{ flex:1; min-width:180px; }
.field label{
  display:block;
  font-size:0.78rem;
  font-weight:600;
  color:var(--text-tertiary);
  text-transform:uppercase;
  letter-spacing:0.04em;
  margin-bottom:0.4rem;
}
.field input, .field textarea{
  width:100%;
  font-family:inherit;
  font-size:0.95rem;
  color:var(--text-primary);
  background:var(--bg-secondary);
  border:1px solid var(--card-border);
  border-radius:14px;
  padding:0.75rem 1rem;
  transition:var(--transition-fast);
}
.field input:focus, .field textarea:focus{
  outline:none;
  border-color:var(--pink-primary);
  box-shadow:0 0 0 4px var(--pink-tint);
}
.field input[type=number]{ text-align:right; }

/* Buttons */
.pill-btn{
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  padding:0.85rem 1.6rem;
  font-family:inherit;
  font-size:0.92rem;
  font-weight:600;
  border-radius:var(--radius-pill);
  cursor:pointer;
  border:1px solid transparent;
  transition:var(--transition-fast);
  white-space:nowrap;
}
.pill-btn.primary{
  background:var(--pink-gradient);
  color:var(--text-light);
  box-shadow:0 8px 20px var(--pink-glow);
}
.pill-btn.primary:hover{ transform:translateY(-2px); box-shadow:0 12px 26px var(--pink-glow); }
.pill-btn.primary:disabled{
  background:var(--bg-secondary);
  color:var(--text-tertiary);
  box-shadow:none;
  cursor:not-allowed;
  transform:none;
}
.pill-btn.ghost{
  background:var(--bg-secondary);
  color:var(--text-primary);
  border-color:var(--card-border);
}
.pill-btn.ghost:hover{ background:var(--pink-soft); color:var(--pink-primary); border-color:rgba(255,45,85,0.3); }

.secondary-link-btn{
  background:none; border:none;
  color:var(--text-secondary);
  font-family:inherit;
  font-size:0.9rem;
  font-weight:500;
  display:inline-flex; align-items:center; gap:0.4rem;
  cursor:pointer;
  padding:0.4rem 1rem;
  border-radius:var(--radius-pill);
  transition:var(--transition-fast);
}
.secondary-link-btn:hover{ color:var(--pink-primary); background-color:var(--pink-soft); }

.add-resource-card{
  width:100%;
  background:var(--bg-secondary);
  border:1px dashed var(--card-border);
  border-radius:var(--radius-rect-squarcle);
  padding:1.3rem 1.5rem;
  display:flex;
  flex-direction:column;
  gap:0.9rem;
}

.actions-row{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:0.4rem;
}

/* Sliders */
.slider-card{
  width:100%;
  background:var(--card-bg);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow-card);
  border-radius:var(--radius-rect-squarcle);
  padding:1.3rem 1.5rem;
}
.slider-top{
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.9rem;
}
.slider-top .name{ font-weight:600; font-size:0.98rem; }
.slider-top .amt{ font-variant-numeric:tabular-nums; font-weight:700; color:var(--pink-primary); }
input[type=range]{
  -webkit-appearance:none; width:100%; height:4px;
  background:var(--bg-secondary); border-radius:4px; outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:20px; height:20px; border-radius:50%;
  background:var(--text-light);
  border:3px solid var(--pink-primary);
  box-shadow:var(--shadow-subtle);
  cursor:pointer; margin-top:-8px;
}
input[type=range]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%;
  background:var(--text-light); border:3px solid var(--pink-primary); cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{ height:4px; background:var(--bg-secondary); border-radius:4px; }
.range-bounds{
  display:flex; justify-content:space-between;
  font-size:0.75rem; color:var(--text-tertiary);
  margin-top:0.6rem; font-variant-numeric:tabular-nums;
}

/* Scenario status cards */
.status-pill{
  font-size:0.72rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.04em;
  padding:0.3rem 0.7rem;
  border-radius:var(--radius-pill);
  display:inline-flex; align-items:center; gap:0.35rem;
  flex-shrink:0;
}
.status-pill.pending{ background:var(--pink-soft); color:var(--pink-primary); }
.status-pill.completed{ background:#E8F7EE; color:#1E8E4C; }
.status-pill.error{ background:#FDEDEB; color:#C0392B; }

.scenario-body{ width:100%; }
.scenario-head{ display:flex; justify-content:space-between; align-items:center; width:100%; }
.scenario-summary{ font-size:0.86rem; color:var(--text-secondary); margin-top:0.6rem; line-height:1.5; }
.scenario-metrics{ display:flex; gap:1rem; margin-top:0.7rem; font-size:0.8rem; font-variant-numeric:tabular-nums; flex-wrap:wrap; }
.scenario-metrics b{ font-weight:700; }
.metric-up{ color:#1E8E4C; }
.metric-down{ color:var(--pink-primary); }

.spinner{
  display:inline-block; width:10px; height:10px;
  border:2px solid rgba(255,45,85,0.25);
  border-top-color:var(--pink-primary);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Comparison */
.compare-card{
  width:100%;
  background:var(--card-bg);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid var(--card-border);
  box-shadow:var(--shadow-card);
  border-radius:var(--radius-big-squarcle);
  padding:1.8rem 2rem;
  transition:var(--transition-apple);
}
.compare-card.recommended{
  border-color:var(--card-border-hover);
  box-shadow:var(--shadow-card-hover);
  background:linear-gradient(180deg, var(--pink-tint) 0%, var(--card-bg) 60%);
}
.compare-top{ display:flex; justify-content:space-between; align-items:baseline; }
.compare-top .sname{ font-weight:700; font-size:1.1rem; }
.compare-top .score{ font-size:1.3rem; font-weight:700; color:var(--pink-primary); font-variant-numeric:tabular-nums; }
.bar-track{ height:8px; background:var(--bg-secondary); border-radius:8px; margin:0.9rem 0; overflow:hidden; }
.bar-fill{ height:100%; background:var(--pink-gradient); border-radius:8px; transition:width 0.6s cubic-bezier(0.16,1,0.3,1); }
.rec-tag{
  display:inline-flex; align-items:center; gap:0.35rem;
  font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
  color:var(--pink-primary); margin-top:0.9rem;
}

.footnote{
  font-size:0.78rem;
  color:var(--text-tertiary);
  margin-top:1rem;
  text-align:center;
}

@media (max-width:600px){
  .screen-section{ padding:4rem 1.2rem 3rem; }
  .field-group{ flex-direction:column; align-items:stretch; }
  .compare-card{ padding:1.4rem 1.4rem; }
}
</style>
</head>
<body>
<div class="grain-overlay"></div>
<div class="app-viewport" id="app-viewport">
  <!-- screen sections injected by JS -->
</div>

<script>
const STORAGE_KEY = 'finance-sim:data';

let state = { step:'resources', resources:[], scenarios:[], loaded:false };
let nextResId = 1, nextScenarioId = 1;
let currentAllocations = {};
let isTransitioning = false;
const STEP_ORDER = ['resources','stoploss','scenario','compare'];
const STEP_LABEL = {resources:'Resources', stoploss:'Stop-loss', scenario:'Scenarios', compare:'Compare'};

function fmt(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
function clamp(n){ n = Number(n); if(isNaN(n)) return 5; return Math.min(10, Math.max(1, n)); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str||''; return d.innerHTML; }

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state.resources = parsed.resources || [];
      state.scenarios = parsed.scenarios || [];
      nextResId = (Math.max(0, ...state.resources.map(r=>r.id)) || 0) + 1;
      nextScenarioId = (Math.max(0, ...state.scenarios.map(s=>s.id)) || 0) + 1;
    }
  }catch(e){ /* fresh start */ }
  state.loaded = true;
  render(true);
}
async function persist(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify({resources:state.resources, scenarios:state.scenarios})); }
  catch(e){ console.error('Could not save', e); }
}

function canGoTo(key){
  if(key==='resources') return true;
  if(key==='stoploss') return state.resources.length>0;
  if(key==='scenario') return state.resources.length>0 && state.resources.every(r=>r.stopLoss>0);
  if(key==='compare') return state.scenarios.some(s=>s.status==='completed');
  return false;
}

function setStep(next){
  if(isTransitioning || next===state.step) return;
  if(!canGoTo(next)) return;
  isTransitioning = true;
  state.step = next;
  render(false);
  setTimeout(()=>{ isTransitioning = false; }, 700);
}
window.setStep = setStep;

// ---------- Resources ----------
function addResource(){
  const nameEl = document.getElementById('res-name');
  const descEl = document.getElementById('res-desc');
  if(!nameEl.value.trim()) return;
  state.resources.push({id:nextResId++, name:nameEl.value.trim(), description:descEl.value.trim(), stopLoss:null});
  nameEl.value=''; descEl.value='';
  persist(); renderInPlace();
}
function removeResource(id){ state.resources = state.resources.filter(r=>r.id!==id); persist(); renderInPlace(); }
function setStopLoss(id, val){ const r = state.resources.find(r=>r.id===id); if(r) r.stopLoss = val; persist(); }

// ---------- Scenario builder ----------
function initAllocations(){
  currentAllocations = {};
  state.resources.forEach(r=>{ currentAllocations[r.id] = r.stopLoss; });
}
function sliderPosFromValue(val,min,max){ if(min<=0) min=1; const t=Math.log(val/min)/Math.log(max/min); return Math.round(t*1000); }
function valueFromSliderPos(pos,min,max){ if(min<=0) min=1; const t=pos/1000; return min*Math.pow(max/min,t); }
function onSliderInput(resId,pos){
  const r = state.resources.find(x=>x.id===resId);
  currentAllocations[resId] = valueFromSliderPos(Number(pos), r.stopLoss, r.stopLoss*10000);
  const amtEl = document.getElementById('amt-'+resId);
  if(amtEl) amtEl.textContent = fmt(currentAllocations[resId]);
}
async function saveScenario(){
  const scenario = {
    id:nextScenarioId++, label:'Scenario ' + (state.scenarios.length+1),
    allocations:{...currentAllocations}, status:'pending',
    profitPotential:null, businessBenefit:null, riskExposure:null, summary:null, score:null
  };
  state.scenarios.push(scenario);
  initAllocations(); persist(); renderInPlace();
  runSimulation(scenario.id);
}
async function runSimulation(scenarioId){
  const scenario = state.scenarios.find(s=>s.id===scenarioId);
  if(!scenario) return;
  const lines = state.resources.map(r=>{
    const val = scenario.allocations[r.id];
    return `- ${r.name}: allocated ${fmt(val)} (stop-loss level ${fmt(r.stopLoss)}). Description: ${r.description || 'no description given'}.`;
  }).join('\n');
  const prompt = `You are a business decision-simulation engine. A user proposed this resource allocation scenario:\n\n${lines}\n\nEvaluate it, considering how far each resource sits above its stop-loss level, what it represents per its description, and how the allocations interact.\n\nRespond with ONLY a JSON object, no markdown fences:\n{"profitPotential": <int 1-10>, "businessBenefit": <int 1-10>, "riskExposure": <int 1-10, 10=highest risk>, "summary": "<1-2 sentence plain-language assessment, under 240 characters>"}`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:prompt}]})
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    const clean = (textBlock ? textBlock.text : '').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    scenario.profitPotential = clamp(parsed.profitPotential);
    scenario.businessBenefit = clamp(parsed.businessBenefit);
    scenario.riskExposure = clamp(parsed.riskExposure);
    scenario.summary = parsed.summary || '';
    scenario.score = Math.round(((scenario.profitPotential + scenario.businessBenefit) - scenario.riskExposure + 10) / 30 * 100);
    scenario.status = 'completed';
  }catch(e){ console.error('Simulation failed', e); scenario.status = 'error'; }
  persist(); renderInPlace();
}
function removeScenario(id){ state.scenarios = state.scenarios.filter(s=>s.id!==id); persist(); renderInPlace(); }
function retryScenario(id){ const s = state.scenarios.find(x=>x.id===id); if(s){ s.status='pending'; renderInPlace(); runSimulation(id); } }

// ---------- Render ----------
function tabsHtml(){
  return `<div class="step-tabs">${STEP_ORDER.map(k=>{
    const allowed = canGoTo(k);
    return `<button class="step-tab${state.step===k?' active':''}" ${allowed?`onclick="setStep('${k}')"`:'disabled'}>${STEP_LABEL[k]}</button>`;
  }).join('')}</div>`;
}

function screenHtml(){
  if(state.step==='resources') return resourcesScreen();
  if(state.step==='stoploss') return stoplossScreen();
  if(state.step==='scenario') return scenarioScreen();
  if(state.step==='compare') return compareScreen();
}

function resourcesScreen(){
  const rows = state.resources.map(r=>`
    <div class="rect-squarcle">
      <div class="rect-badge">₹</div>
      <div class="rect-text">
        <div class="rect-title">${escapeHtml(r.name)}</div>
        ${r.description?`<div class="rect-desc">${escapeHtml(r.description)}</div>`:''}
      </div>
      <button class="icon-remove" onclick="removeResource(${r.id})" aria-label="Remove">✕</button>
    </div>
  `).join('');
  return `
    <div class="finance-header">
      <div><span class="subheading-tag">Finance</span><div class="section-title">What resources do you have?</div></div>
    </div>
    <div class="section-desc">List the capital, capacity, or assets you could put behind a decision. A short description helps the simulation understand what changing each one means for the business.</div>
    ${tabsHtml()}
    <div class="list-stack">${rows || `<div class="empty-state">No resources added yet.</div>`}</div>
    <div class="add-resource-card">
      <div class="field-group">
        <div class="field"><label>Resource name</label><input type="text" id="res-name" placeholder="e.g. Cash reserve"></div>
        <div class="field"><label>Description (optional)</label><input type="text" id="res-desc" placeholder="e.g. Liquid capital for expansion"></div>
      </div>
      <div><button class="pill-btn ghost" onclick="addResource()">＋ Add resource</button></div>
    </div>
    <div class="actions-row">
      <span></span>
      <button class="pill-btn primary" ${state.resources.length===0?'disabled':''} onclick="setStep('stoploss')">Done with resources</button>
    </div>
  `;
}

function stoplossScreen(){
  const rows = state.resources.map(r=>`
    <div class="rect-squarcle">
      <div class="rect-badge">₹</div>
      <div class="rect-text">
        <div class="rect-title">${escapeHtml(r.name)}</div>
        ${r.description?`<div class="rect-desc">${escapeHtml(r.description)}</div>`:''}
      </div>
      <input type="number" min="1" step="1" style="width:130px" value="${r.stopLoss ?? ''}" placeholder="₹ minimum"
        onchange="setStopLoss(${r.id}, Number(this.value)); renderInPlace();">
    </div>
  `).join('');
  return `
    <div class="finance-header">
      <div><span class="subheading-tag">Finance</span><div class="section-title">Minimum stop-loss</div></div>
    </div>
    <div class="section-desc">Set the minimum amount you'd still commit to each resource — the floor below which a scenario isn't worth doing. This anchors the low end of the range you'll explore next.</div>
    ${tabsHtml()}
    <div class="list-stack">${rows}</div>
    <div class="actions-row">
      <button class="secondary-link-btn" onclick="setStep('resources')">← Back</button>
      <button class="pill-btn primary" ${state.resources.every(r=>r.stopLoss>0)?'':'disabled'} onclick="initAllocations(); setStep('scenario')">Continue</button>
    </div>
  `;
}

function scenarioScreen(){
  if(Object.keys(currentAllocations).length !== state.resources.length) initAllocations();
  const sliders = state.resources.map(r=>{
    const min=r.stopLoss, max=r.stopLoss*10000;
    const val = currentAllocations[r.id] ?? min;
    const pos = sliderPosFromValue(val,min,max);
    return `
      <div class="slider-card">
        <div class="slider-top"><span class="name">${escapeHtml(r.name)}</span><span class="amt" id="amt-${r.id}">${fmt(val)}</span></div>
        <input type="range" min="0" max="1000" value="${pos}" oninput="onSliderInput(${r.id}, this.value)">
        <div class="range-bounds"><span>${fmt(min)}</span><span>${fmt(max)}</span></div>
      </div>`;
  }).join('');

  const scenarioCards = state.scenarios.slice().reverse().map(s=>`
    <div class="rect-squarcle" style="align-items:flex-start; flex-direction:column;">
      <div class="scenario-head">
        <span class="rect-title">${s.label}</span>
        <span class="status-pill ${s.status}">${s.status==='pending'?'<span class="spinner"></span> Simulating':s.status==='completed'?'Complete':'Failed'}</span>
      </div>
      <div class="scenario-body">
        ${s.status==='completed'?`
          <div class="scenario-summary">${escapeHtml(s.summary||'')}</div>
          <div class="scenario-metrics">
            <span class="metric-up">Profit <b>${s.profitPotential}/10</b></span>
            <span class="metric-up">Benefit <b>${s.businessBenefit}/10</b></span>
            <span class="metric-down">Risk <b>${s.riskExposure}/10</b></span>
          </div>`:''}
        ${s.status==='error'?`<div class="scenario-summary">Simulation failed. <button class="secondary-link-btn" style="padding:0" onclick="retryScenario(${s.id})">Retry</button></div>`:''}
      </div>
      <button class="secondary-link-btn" style="margin-top:0.6rem; padding-left:0;" onclick="removeScenario(${s.id})">Remove</button>
    </div>
  `).join('');

  return `
    <div class="finance-header">
      <div><span class="subheading-tag">Finance</span><div class="section-title">Build a scenario</div></div>
    </div>
    <div class="section-desc">Drag each resource to the level you'd allocate, then save. The range runs from your stop-loss up to ten thousand times that.</div>
    ${tabsHtml()}
    <div class="list-stack">${sliders}</div>
    <div class="actions-row">
      <button class="secondary-link-btn" onclick="setStep('stoploss')">← Back</button>
      <button class="pill-btn primary" onclick="saveScenario()">Save scenario</button>
    </div>
    ${state.scenarios.length ? `
      <div class="finance-header" style="margin-top:1rem;">
        <div><div class="section-title" style="font-size:1.15rem;">Saved scenarios</div><div class="section-desc" style="margin-top:0.2rem;">${state.scenarios.length} saved</div></div>
      </div>
      <div class="list-stack">${scenarioCards}</div>
      <div class="actions-row">
        <span></span>
        <button class="pill-btn primary" ${state.scenarios.some(s=>s.status==='completed')?'':'disabled'} onclick="setStep('compare')">View comparison</button>
      </div>
    ` : ''}
  `;
}

function compareScreen(){
  const completed = state.scenarios.filter(s=>s.status==='completed');
  if(!completed.length){
    return `
      <div class="finance-header"><div><span class="subheading-tag">Finance</span><div class="section-title">Scenario comparison</div></div></div>
      ${tabsHtml()}
      <div class="empty-state">No completed simulations yet — save a scenario first.</div>
      <div class="actions-row"><button class="secondary-link-btn" onclick="setStep('scenario')">← Back to scenarios</button><span></span></div>
    `;
  }
  const maxScore = Math.max(...completed.map(s=>s.score));
  const rows = completed.slice().sort((a,b)=>b.score-a.score).map(s=>{
    const isTop = s.score===maxScore;
    return `
      <div class="compare-card${isTop?' recommended':''}">
        <div class="compare-top"><span class="sname">${s.label}</span><span class="score">${s.score}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${s.score}%"></div></div>
        <div class="scenario-metrics">
          <span class="metric-up">Profit potential ${s.profitPotential}/10</span>
          <span class="metric-up">Business benefit ${s.businessBenefit}/10</span>
          <span class="metric-down">Risk exposure ${s.riskExposure}/10</span>
        </div>
        <div class="scenario-summary">${escapeHtml(s.summary||'')}</div>
        ${isTop?'<div class="rec-tag">★ Recommended</div>':''}
      </div>`;
  }).join('');

  return `
    <div class="finance-header"><div><span class="subheading-tag">Finance</span><div class="section-title">Scenario comparison</div></div></div>
    <div class="section-desc">Ranked by overall score — profit potential and business benefit weighed against risk exposure.</div>
    ${tabsHtml()}
    <div class="list-stack">${rows}</div>
    <div class="actions-row"><button class="secondary-link-btn" onclick="setStep('scenario')">← Build another scenario</button><span></span></div>
    <div class="footnote">Scores come from an AI simulation of each allocation and are directional, not financial advice.</div>
  `;
}

// Full render with screen-section transition wrapper (used on load and step changes)
function render(isInitial){
  const viewport = document.getElementById('app-viewport');
  if(!state.loaded){
    viewport.innerHTML = `<div class="screen-section active"><div class="page-container"><div class="empty-state">Loading…</div></div></div>`;
    return;
  }
  const html = `<div class="page-container">${screenHtml()}</div>`;
  if(isInitial){
    viewport.innerHTML = `<div class="screen-section active" id="screen-current">${html}</div>`;
    return;
  }
  // Transition: fade/slide the old screen out, new one in
  const old = document.getElementById('screen-current');
  if(old){
    old.id = 'screen-old';
    old.classList.remove('active');
    old.classList.add('exit-up');
    setTimeout(()=>{ old.remove(); }, 720);
  }
  const fresh = document.createElement('div');
  fresh.className = 'screen-section pre-enter';
  fresh.id = 'screen-current';
  fresh.innerHTML = html;
  viewport.appendChild(fresh);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      fresh.classList.remove('pre-enter');
      fresh.classList.add('active');
    });
  });
}

// Lightweight in-place refresh (no transition) for edits within the same step
function renderInPlace(){
  const current = document.getElementById('screen-current');
  if(!current) return;
  current.innerHTML = `<div class="page-container">${screenHtml()}</div>`;
}

loadData();
</script>
